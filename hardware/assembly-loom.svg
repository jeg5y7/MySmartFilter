<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" font-family="-apple-system, 'Segoe UI', sans-serif">
  <rect width="1100" height="800" fill="#0f172a"/>

  <!-- Title -->
  <text x="40" y="46" fill="#e2e8f0" font-size="24" font-weight="700">MySmartFilter — beta build sheet: the wiring loom</text>
  <text x="40" y="72" fill="#64748b" font-size="14">No breadboards. 8 wires + 5 resistors spliced into the loom itself — everything fits the Rev A-USB enclosure.</text>

  <!-- ══ ESP32 DevKit board ══ -->
  <rect x="80" y="120" width="220" height="350" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <rect x="130" y="132" width="110" height="60" rx="4" fill="#334155" stroke="#475569"/>
  <text x="185" y="167" fill="#94a3b8" font-size="12" text-anchor="middle">ESP32-WROOM-32</text>
  <text x="190" y="458" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">ESP32 DevKit V1</text>
  <text x="190" y="488" fill="#64748b" font-size="10" text-anchor="middle">USB port faces the wall opening</text>

  <!-- Board pins (right edge) -->
  <g font-size="13" font-weight="600">
    <circle cx="300" cy="200" r="5" fill="#f87171"/><text x="288" y="205" fill="#f87171" text-anchor="end">3V3</text>
    <circle cx="300" cy="232" r="5" fill="#94a3b8"/><text x="288" y="237" fill="#94a3b8" text-anchor="end">GND</text>
    <circle cx="300" cy="264" r="5" fill="#facc15"/><text x="288" y="269" fill="#facc15" text-anchor="end">GPIO21</text>
    <circle cx="300" cy="296" r="5" fill="#4ade80"/><text x="288" y="301" fill="#4ade80" text-anchor="end">GPIO22</text>
    <circle cx="300" cy="340" r="5" fill="#f87171"/><text x="288" y="345" fill="#f87171" text-anchor="end">GPIO25</text>
    <circle cx="300" cy="372" r="5" fill="#4ade80"/><text x="288" y="377" fill="#4ade80" text-anchor="end">GPIO26</text>
    <circle cx="300" cy="404" r="5" fill="#38bdf8"/><text x="288" y="409" fill="#38bdf8" text-anchor="end">GPIO27</text>
    <circle cx="300" cy="436" r="5" fill="#94a3b8"/><text x="288" y="441" fill="#94a3b8" text-anchor="end">GND</text>
  </g>

  <!-- glue dabs on ESP32 connector cluster -->
  <g fill="#f59e0b" opacity="0.85">
    <ellipse cx="312" cy="200" rx="7" ry="5"/>
    <ellipse cx="312" cy="232" rx="7" ry="5"/>
    <ellipse cx="312" cy="264" rx="7" ry="5"/>
    <ellipse cx="312" cy="296" rx="7" ry="5"/>
    <ellipse cx="312" cy="340" rx="7" ry="5"/>
    <ellipse cx="312" cy="372" rx="7" ry="5"/>
    <ellipse cx="312" cy="404" rx="7" ry="5"/>
    <ellipse cx="312" cy="436" rx="7" ry="5"/>
  </g>
  <circle cx="330" cy="160" r="12" fill="#2563eb"/><text x="330" y="165" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">6</text>
  <text x="348" y="156" fill="#f59e0b" font-size="11">hot-glue every pushed-on</text>
  <text x="348" y="170" fill="#f59e0b" font-size="11">connector — AFTER testing</text>

  <!-- ══ SDP810 sensor ══ -->
  <rect x="790" y="120" width="230" height="230" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="905" y="150" fill="#e2e8f0" font-size="15" font-weight="600" text-anchor="middle">SDP810</text>
  <text x="905" y="167" fill="#64748b" font-size="11" text-anchor="middle">label facing you, pins down: pin 1 LEFT</text>
  <g font-size="13" font-weight="600">
    <circle cx="790" cy="195" r="5" fill="#f87171"/><text x="803" y="200" fill="#f87171">VDD <tspan fill="#94a3b8" font-size="11">· pin 2</tspan></text>
    <circle cx="790" cy="230" r="5" fill="#94a3b8"/><text x="803" y="235" fill="#94a3b8">GND <tspan font-size="11">· pin 3</tspan></text>
    <circle cx="790" cy="265" r="5" fill="#facc15"/><text x="803" y="270" fill="#facc15">SDA <tspan fill="#94a3b8" font-size="11">· pin 4</tspan></text>
    <circle cx="790" cy="300" r="5" fill="#4ade80"/><text x="803" y="305" fill="#4ade80">SCL <tspan fill="#94a3b8" font-size="11">· pin 1</tspan></text>
  </g>
  <text x="905" y="335" fill="#64748b" font-size="10" text-anchor="middle">tubes exit the far side → grommeted wall holes</text>

  <!-- glue dabs on sensor connectors -->
  <g fill="#f59e0b" opacity="0.85">
    <ellipse cx="778" cy="195" rx="7" ry="5"/>
    <ellipse cx="778" cy="230" rx="7" ry="5"/>
    <ellipse cx="778" cy="265" rx="7" ry="5"/>
    <ellipse cx="778" cy="300" rx="7" ry="5"/>
  </g>

  <!-- I2C + power wires ESP32 → sensor -->
  <path d="M300 200 H 560 V 195 H 790" stroke="#f87171" stroke-width="2.5" fill="none"/>
  <path d="M300 232 H 580 V 230 H 790" stroke="#94a3b8" stroke-width="2.5" fill="none"/>
  <path d="M300 264 H 600 V 265 H 790" stroke="#facc15" stroke-width="2.5" fill="none"/>
  <path d="M300 296 H 620 V 300 H 790" stroke="#4ade80" stroke-width="2.5" fill="none"/>

  <!-- Pull-up resistors soldered across sensor pins -->
  <rect x="740" y="215" width="13" height="28" rx="3" fill="none" stroke="#facc15" stroke-width="2"/>
  <path d="M746 215 V 195 H 790" stroke="#facc15" stroke-width="1.5" fill="none" stroke-dasharray="3 3"/>
  <path d="M746 243 V 265" stroke="#facc15" stroke-width="1.5" fill="none"/>
  <rect x="712" y="230" width="13" height="28" rx="3" fill="none" stroke="#4ade80" stroke-width="2"/>
  <path d="M718 230 V 195 H 790" stroke="#4ade80" stroke-width="1.5" fill="none" stroke-dasharray="3 3"/>
  <path d="M718 258 V 300" stroke="#4ade80" stroke-width="1.5" fill="none"/>
  <circle cx="712" cy="395" r="12" fill="#2563eb"/><text x="712" y="400" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">2</text>
  <text x="730" y="391" fill="#94a3b8" font-size="11">2 × 10 kΩ pull-ups soldered right across the</text>
  <text x="730" y="405" fill="#94a3b8" font-size="11">sensor pins (2→4, 2→1), heat-shrink the cluster</text>

  <!-- wire-length note -->
  <text x="470" y="330" fill="#64748b" font-size="11" text-anchor="middle">all runs ≈ 8 cm (3 in) — enough slack to fold, no spaghetti</text>

  <!-- ══ LED wires with inline spliced resistors ══ -->
  <path d="M300 340 H 385" stroke="#f87171" stroke-width="2.5" fill="none"/>
  <path d="M441 340 H 480 V 490 H 543" stroke="#f87171" stroke-width="2.5" fill="none"/>
  <path d="M300 372 H 385" stroke="#4ade80" stroke-width="2.5" fill="none"/>
  <path d="M441 372 H 460 V 505 H 543" stroke="#4ade80" stroke-width="2.5" fill="none"/>
  <path d="M300 404 H 385" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
  <path d="M441 404 H 440 V 520 H 543" stroke="#38bdf8" stroke-width="2.5" fill="none"/>

  <!-- heat-shrink splice blocks -->
  <g>
    <rect x="385" y="331" width="56" height="18" rx="9" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
    <rect x="399" y="336" width="28" height="8" rx="2" fill="#78350f"/>
    <rect x="385" y="363" width="56" height="18" rx="9" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
    <rect x="399" y="368" width="28" height="8" rx="2" fill="#78350f"/>
    <rect x="385" y="395" width="56" height="18" rx="9" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="399" y="400" width="28" height="8" rx="2" fill="#78350f"/>
  </g>
  <circle cx="413" cy="310" r="12" fill="#2563eb"/><text x="413" y="315" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">1</text>
  <text x="432" y="314" fill="#94a3b8" font-size="11">3 × 220 Ω spliced inline, heat-shrink over each (see detail)</text>

  <!-- RGB LED -->
  <circle cx="560" cy="505" r="18" fill="none" stroke="#e2e8f0" stroke-width="2.5"/>
  <circle cx="560" cy="505" r="8" fill="#a78bfa" opacity="0.8"/>
  <text x="560" y="475" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">RGB LED (common cathode)</text>
  <text x="560" y="545" fill="#64748b" font-size="10" text-anchor="middle">sits under the lid's glow window</text>
  <circle cx="712" cy="518" r="12" fill="#2563eb"/><text x="712" y="523" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">3</text>
  <text x="730" y="514" fill="#94a3b8" font-size="11">solder wires to the legs — stagger the</text>
  <text x="730" y="528" fill="#94a3b8" font-size="11">lengths, heat-shrink each leg separately</text>

  <!-- common cathode → GND -->
  <path d="M578 505 H 630 V 560 H 340 V 436 H 300" stroke="#94a3b8" stroke-width="2.5" fill="none" opacity="0.85"/>
  <text x="480" y="576" fill="#94a3b8" font-size="11" text-anchor="middle">longest (common) leg → GND</text>

  <!-- ══ Detail inset: spliced wire ══ -->
  <g transform="translate(60,600)">
    <rect x="0" y="0" width="480" height="160" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="16" y="26" fill="#e2e8f0" font-size="13" font-weight="600">Detail — one resistor-spliced LED wire (make 3)</text>
    <!-- female connector left -->
    <rect x="26" y="66" width="34" height="18" rx="3" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M60 75 H 150" stroke="#f87171" stroke-width="3" fill="none"/>
    <!-- heat shrink tube (translucent) with resistor inside -->
    <rect x="150" y="63" width="120" height="24" rx="12" fill="#334155" opacity="0.9" stroke="#f87171" stroke-width="1.5"/>
    <rect x="180" y="69" width="60" height="12" rx="3" fill="#78350f" stroke="#b45309"/>
    <text x="210" y="79" fill="#fcd34d" font-size="9" text-anchor="middle">220 Ω</text>
    <path d="M270 75 H 388" stroke="#f87171" stroke-width="3" fill="none"/>
    <!-- female connector right -->
    <rect x="388" y="66" width="34" height="18" rx="3" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="43" y="106" fill="#64748b" font-size="10" text-anchor="middle">plugs onto</text>
    <text x="43" y="118" fill="#64748b" font-size="10" text-anchor="middle">GPIO pin</text>
    <text x="405" y="106" fill="#64748b" font-size="10" text-anchor="middle">solder to</text>
    <text x="405" y="118" fill="#64748b" font-size="10" text-anchor="middle">LED leg</text>
    <text x="210" y="112" fill="#94a3b8" font-size="11" text-anchor="middle">cut one jumper in half · slide heat-shrink on FIRST ·</text>
    <text x="210" y="126" fill="#94a3b8" font-size="11" text-anchor="middle">solder resistor between the halves · shrink it down</text>
    <text x="16" y="150" fill="#64748b" font-size="10">Tip: use a red, green and blue wire so the colors label themselves.</text>
  </g>

  <!-- ══ Build order ══ -->
  <g transform="translate(570,600)">
    <rect x="0" y="0" width="490" height="160" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="16" y="26" fill="#e2e8f0" font-size="13" font-weight="600">Build order (per unit)</text>
    <text x="16" y="48" fill="#94a3b8" font-size="12"><tspan fill="#60a5fa" font-weight="700">1</tspan>  Make the three 220 Ω LED wires (detail at left)</text>
    <text x="16" y="66" fill="#94a3b8" font-size="12"><tspan fill="#60a5fa" font-weight="700">2</tspan>  Solder both 10 kΩ pull-ups across the sensor pins</text>
    <text x="16" y="84" fill="#94a3b8" font-size="12"><tspan fill="#60a5fa" font-weight="700">3</tspan>  Solder LED wires + GND to the LED legs, heat-shrink each</text>
    <text x="16" y="102" fill="#94a3b8" font-size="12"><tspan fill="#60a5fa" font-weight="700">4</tspan>  Push all connectors onto the pins, matching the colors</text>
    <text x="16" y="120" fill="#94a3b8" font-size="12"><tspan fill="#60a5fa" font-weight="700">5</tspan>  TEST: flash, WiFi setup, dashboard readings, glow colors</text>
    <text x="16" y="138" fill="#94a3b8" font-size="12"><tspan fill="#60a5fa" font-weight="700">6</tspan>  Only then: hot-glue every connector, fold loom, mount in box</text>
  </g>
</svg>
