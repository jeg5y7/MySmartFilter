; PlatformIO Project Configuration File
;
; Build options: build flags, source filter, upload options
; Advanced options: extra scripting
; Please visit documentation: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-dev

; Shared configuration for all environments
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = default.csv

; Library dependencies
lib_deps = 
    bblanchon/ArduinoJson@^7.0.4
    
; Build flags for all environments
build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_ARDUHAL_LOG_COLORS=1

; Development environment - connects to local server
[env:esp32-dev]
build_flags = 
    ${env.build_flags}
    -D 'ENVIRONMENT="DEV"'
    -D 'API_BASE_URL="http://10.0.0.21:3000/api"'
    -D DEBUG_MODE=1
    
; Production environment - connects to production server
[env:esp32-prod]
build_flags = 
    ${env.build_flags}
    -D 'ENVIRONMENT="PROD"'
    -D 'API_BASE_URL="https://mysmartfilter.com/api"'
    -D DEBUG_MODE=0
    
; Test environment - includes test mode and verbose logging
[env:esp32-test]
build_flags = 
    ${env.build_flags}
    -D 'ENVIRONMENT="TEST"'
    -D 'API_BASE_URL="http://10.0.0.21:3000/api"'
    -D DEBUG_MODE=1
    -D TEST_MODE=1
    -D SKIP_SENSOR=1  ; Skip sensor initialization for testing without hardware

; OTA (Over-The-Air) update environment
[env:esp32-ota]
build_flags = 
    ${env.build_flags}
    -D ENVIRONMENT=PROD
    -D API_BASE_URL="https://mysmartfilter.com/api"
    -D ENABLE_OTA=1
upload_protocol = espota
upload_port = 192.168.1.100 ; Change to your ESP32's IP

; WiFiManager environment - Captive portal for WiFi configuration
[env:esp32-wifimanager]
build_src_filter = +<wifimanager_main.cpp> -<main.cpp>
build_flags = 
    ${env.build_flags}
    -D 'API_URL="http://10.0.0.21:3000/api"'  ; Local server for testing
    -D USE_TEST_DATA=1  ; Use test data until sensor is connected

; WiFiManager Debug environment - Enhanced debugging
[env:esp32-wifimanager-debug]
build_src_filter = +<wifimanager_debug.cpp> -<main.cpp>
build_flags = 
    ${env.build_flags}
    -D 'API_URL="https://mysmartfilter.com/api"'
    -D DEBUG_MODE=1
monitor_filters = direct

; EEPROM Test environment - Test configuration persistence
[env:esp32-eeprom-test]
build_src_filter = +<test_eeprom.cpp> -<main.cpp> -<wifimanager_main.cpp>
build_flags = 
    ${env.build_flags}
    -D DEBUG_MODE=1

; WiFi Test environment - Test WiFi connection status
[env:esp32-wifi-test]
build_src_filter = +<wifi_test.cpp> -<main.cpp> -<wifimanager_main.cpp>
build_flags = 
    ${env.build_flags}
    -D DEBUG_MODE=1

; Simple WiFiManager - Minimal, reliable WiFi configuration
[env:esp32-simple-wifi]
build_src_filter = +<simple_wifimanager.cpp> -<main.cpp> -<wifimanager_main.cpp>
build_flags = 
    ${env.build_flags}
    -D DEBUG_MODE=1

; Test Simple - Hardcoded WiFi for quick testing
[env:test-simple]
build_src_filter = +<test_simple.cpp> -<main.cpp> -<smart_filter_final.cpp>
build_flags = 
    ${env.build_flags}
    -D DEBUG_MODE=1

; SDP810 Sensor - Sensirion differential pressure sensor
[env:sdp810]
build_src_filter = +<sensor_sdp810.cpp> -<main.cpp> -<smart_filter_final.cpp> -<test_simple.cpp>
build_flags = 
    ${env.build_flags}
    -D DEBUG_MODE=1

; SDP810 Diagnostic - Test I2C connection and sensor
[env:sdp810-diag]
build_src_filter = +<sdp810_diagnostic.cpp> -<main.cpp> -<smart_filter_final.cpp> -<test_simple.cpp> -<sensor_sdp810.cpp>
build_flags = 
    ${env.build_flags}
    -D DEBUG_MODE=1

; SDP810 v2 - Improved initialization
[env:sdp810-v2]
build_src_filter = +<sensor_sdp810_v2.cpp> -<main.cpp> -<smart_filter_final.cpp> -<test_simple.cpp> -<sensor_sdp810.cpp>
build_flags = 
    ${env.build_flags}
    -D DEBUG_MODE=1

; ─── Rev B: Battery firmware (deep-sleep batch architecture) ─────────────────
; Samples every 2 min with WiFi off, uploads hourly batches to /api/sensor/batch,
; exception-pushes on blower edges / alert crossings / low battery.

[env:esp32-battery]
build_src_filter = +<smart_filter_battery.cpp>
build_flags =
    ${env.build_flags}
    -D 'ENVIRONMENT="PROD"'
    -D 'API_BASE_URL="https://mysmartfilter.com/api"'
    -D 'FIRMWARE_VERSION="2.0.0-battery"'

; Battery dev — local server + fake sensor data (no hardware needed)
[env:esp32-battery-dev]
build_src_filter = +<smart_filter_battery.cpp>
build_flags =
    ${env.build_flags}
    -D 'ENVIRONMENT="DEV"'
    -D 'API_BASE_URL="http://10.0.0.21:3000/api"'
    -D 'FIRMWARE_VERSION="2.0.0-battery"'
    -D DEBUG_MODE=1
    -D SKIP_SENSOR=1

; ─── Captive Portal (WiFi Setup Flow) ────────────────────────────────────────
; Custom captive portal: boots as AP "SmartFilter_Setup", serves WiFi picker,
; then redirects to mysmartfilter.com/setup/device to complete device linking.

; Dev — points to local server for testing
[env:captive-portal-dev]
build_src_filter = +<captive_portal.cpp> -<main.cpp>
build_flags = 
    ${env.build_flags}
    -D 'API_BASE_URL="http://10.0.0.21:3000/api"'
    -D DEBUG_MODE=1
    -D 'FIRMWARE_VERSION="1.0.0"'

; Prod — points to production API
[env:captive-portal-prod]
build_src_filter = +<captive_portal.cpp> -<main.cpp>
build_flags =
    ${env.build_flags}
    -D 'API_BASE_URL="https://mysmartfilter.com/api"'
    -D DEBUG_MODE=0
    -D 'FIRMWARE_VERSION="1.0.0"'

; ─── USB pilot (always-on, wall/USB powered) ─────────────────────────────────
; Captive-portal firmware + device-secret handshake. Real sensor build for
; assembled units; fake build proves the whole pipeline with a bare board.

[env:usb-pilot-prod]
build_src_filter = +<captive_portal.cpp>
build_flags =
    ${env.build_flags}
    -D 'API_BASE_URL="https://mysmartfilter.com/api"'
    -D DEBUG_MODE=0
    -D 'FIRMWARE_VERSION="1.4.0-usb"'

; Bare-board bench test: no sensor needed, sends simulated blower cycles
[env:usb-pilot-fake]
build_src_filter = +<captive_portal.cpp>
build_flags =
    ${env.build_flags}
    -D 'API_BASE_URL="https://mysmartfilter.com/api"'
    -D DEBUG_MODE=1
    -D SKIP_SENSOR=1
    -D 'FIRMWARE_VERSION="1.4.0-usb-test"'
